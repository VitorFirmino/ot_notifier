name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed area
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
            web:
              - 'web/**'
              - 'landing/**'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'

  backend:
    name: Backend (type-check, lint, test)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ot_notifier
          POSTGRES_PASSWORD: ot_notifier
          POSTGRES_DB: ot_notifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ot_notifier:ot_notifier@localhost:5432/ot_notifier
      BETTER_AUTH_SECRET: ci-test-secret-do-not-use-in-production
      RESEND_API_KEY: ci-dummy-resend-key
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check

      - run: pnpm lint

      - run: pnpm db:auth:migrate

      - run: pnpm db:migration:run

      - run: pnpm test run

  web:
    name: Web (lint, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - working-directory: landing
        run: pnpm install --frozen-lockfile --ignore-workspace

      - working-directory: landing
        run: pnpm lint

      - working-directory: landing
        run: pnpm run build

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - working-directory: web
        run: pnpm install --frozen-lockfile --ignore-workspace

      - working-directory: web
        run: pnpm lint

      - working-directory: web
        run: pnpm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ot_notifier
          POSTGRES_PASSWORD: ot_notifier
          POSTGRES_DB: ot_notifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ot_notifier:ot_notifier@localhost:5432/ot_notifier
      BETTER_AUTH_SECRET: ci-test-secret-do-not-use-in-production
      RESEND_API_KEY: ci-dummy-resend-key
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:auth:migrate

      - run: pnpm db:migration:run

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - working-directory: web
        run: pnpm install --frozen-lockfile --ignore-workspace

      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      - working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - working-directory: web
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7

  audit:
    name: Security audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high --prod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - working-directory: web
        run: pnpm install --frozen-lockfile --ignore-workspace
      - working-directory: web
        run: pnpm audit --audit-level=high --prod

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api:
    name: Deploy API + orchestrator
    needs: [backend, web, e2e, audit, docker]
    if: >
      always() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      needs.e2e.result == 'success' &&
      needs.audit.result == 'success' &&
      needs.docker.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/ot_notifier
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build api ot_notifier

  deploy-web:
    name: Deploy web dashboard
    needs: [backend, web, e2e, audit, docker, deploy-api]
    if: >
      always() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      needs.e2e.result == 'success' &&
      needs.audit.result == 'success' &&
      needs.docker.result == 'success' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/ot_notifier
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build web
