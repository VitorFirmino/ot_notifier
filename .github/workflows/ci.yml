name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (type-check, lint, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ot_notifier
          POSTGRES_PASSWORD: ot_notifier
          POSTGRES_DB: ot_notifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ot_notifier:ot_notifier@localhost:5432/ot_notifier
      BETTER_AUTH_SECRET: ci-test-secret-do-not-use-in-production
      RESEND_API_KEY: ci-dummy-resend-key
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check

      - run: pnpm lint

      - run: pnpm db:auth:migrate

      - run: pnpm db:migration:run

      - run: pnpm test run

  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-workspace

      - run: pnpm lint

      - run: pnpm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ot_notifier
          POSTGRES_PASSWORD: ot_notifier
          POSTGRES_DB: ot_notifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ot_notifier:ot_notifier@localhost:5432/ot_notifier
      BETTER_AUTH_SECRET: ci-test-secret-do-not-use-in-production
      RESEND_API_KEY: ci-dummy-resend-key
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:auth:migrate

      - run: pnpm db:migration:run

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - working-directory: web
        run: pnpm install --frozen-lockfile --ignore-workspace

      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      - working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - working-directory: web
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7

  audit:
    name: Security audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high --prod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - working-directory: web
        run: pnpm install --frozen-lockfile --ignore-workspace
      - working-directory: web
        run: pnpm audit --audit-level=high --prod

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  changes:
    name: Detect changed area
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        run: |
          changed="$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})"
          echo "$changed"

          if echo "$changed" | grep -qE '^(src/|Dockerfile$|docker-compose\.ya?ml$|docker-compose\.prod\.ya?ml$|package\.json$|pnpm-lock\.yaml$|tsconfig.*\.json$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" | grep -qE '^(web/|docker-compose\.ya?ml$|docker-compose\.prod\.ya?ml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    name: Deploy API + orchestrator
    needs: [backend, web, e2e, audit, docker, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/ot_notifier
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build api ot_notifier

  deploy-web:
    name: Deploy web dashboard
    needs: [backend, web, e2e, audit, docker, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/ot_notifier
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build web
