server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Docker's embedded DNS. A plain `proxy_pass http://api:3001` resolves
    # once at startup and caches the IP, so a restarted/recreated api
    # container (new IP) leaves nginx pointing at a dead address until
    # nginx itself restarts. Resolving into a variable forces per-request
    # DNS lookups instead.
    resolver 127.0.0.11 valid=10s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://api.otnotifier.com.br data:; connect-src 'self' https://api.otnotifier.com.br; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    location /api/ {
        # No URI segment after the variable: nginx forwards the original
        # request URI unchanged (it already includes /api/, matching the
        # backend's own route paths 1:1) instead of trying to rewrite the
        # location prefix — which it can't do once the target is dynamic.
        set $api_host api;
        proxy_pass http://$api_host:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /app {
        return 301 $scheme://$http_host/app/;
    }

    location /app/ {
        try_files $uri /app/index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}
