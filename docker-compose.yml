services:
  ot_notifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ot_notifier
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ot_notifier}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/app/src/infrastructure/storage/data
      - states_data:/app/data
      - cloakbrowser_data:/root/.cloakbrowser
      - ./src/infrastructure/storage/servers.json:/app/src/infrastructure/storage/servers.json
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/app/data/.orchestrator-heartbeat'); process.exit(Date.now()-s.mtimeMs<90000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ot_notifier_api
    restart: unless-stopped
    command: ["npm", "run", "api"]
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ot_notifier}
      DASHBOARD_URL: http://localhost:8080
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/app/src/infrastructure/storage/data
      - states_data:/app/data
      - cloakbrowser_data:/root/.cloakbrowser
      - ./src/infrastructure/storage/servers.json:/app/src/infrastructure/storage/servers.json
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ot_notifier_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: ot_notifier_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    container_name: ot_notifier_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER não configurado em .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não configurado em .env}
      POSTGRES_DB: ${POSTGRES_DB:-ot_notifier}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ot_notifier"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storage_data:
  states_data:
  cloakbrowser_data:
  redis_data:
  postgres_data:
